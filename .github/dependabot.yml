version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Pinned to the BB release the plugin targets; bump with `bb plugin types`.
      - dependency-name: "@get-bb/plugin-sdk"
      # The committed Monaco bundle is rebuilt deliberately, not by a bot.
      - dependency-name: monaco-editor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
