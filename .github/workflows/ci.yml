name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Rebuild the Monaco and icon bundle
        run: npm run build:monaco
      - name: Bundle is committed and current
        run: |
          test -f monaco/editor.js && test -f monaco/file-icons/map.json
          git diff --stat --exit-code -- monaco/file-icons/map.json
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml
